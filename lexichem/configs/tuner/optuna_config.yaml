method: 'aligner'
seeds: 
  - 1480
t5:
  pretrained_model_name_or_path: 'QizhiPei/biot5-plus-base'
  dropout: 0.05 
projector:
  latent_dim: 768
  hidden_dim: 2048
  num_layers: 2
  dropout: 0.1
loss:
  seq2seq_lambda: 1.0
  alignment_lambda: 0.5
lr:
  backbone: 1e-4
  projector: 5e-4
trainer:
  max_steps: 100000
  val_check_interval: 2000
  batch_size: 4
  grad_accum: 1
  num_workers: 4
  cuda: true
  strategy: 'ddp'
  num_devices: 4
  warmup_ratio: 0.1 
  precision: '32'
  dataset_name: 'chebi-20'
  output_folder: 'weights/'
  do_enumeration: true
optuna:
  use_optuna: true
  n_trials: 64 # 4x4x4 grid search
project:
  name: 'LexiChem-Optuna-Tuner'
